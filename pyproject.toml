[tool.poetry]
name = "cointegration-gnn"
version = "0.1.0"
description = "Multi-Asset Cointegration GNN for AI Economist Trading"
authors = ["AI Economist <ai.economist@example.com>"]
readme = "README.md"
packages = [{include = "cointegration_gnn"}]

[tool.poetry.dependencies]
python = "^3.12"

# Data & Math
pandas = "^2.2"
polars = "^1.0"
numpy = "^1.26"
scipy = "^1.12"

# Data Sources
yfinance = "^0.2"
# openbb = "^4.0"  # Uncomment when available

# Econometrics
statsmodels = "^0.14"
scikit-learn = "^1.3"

# Deep Learning
torch = "^2.2"
pytorch-lightning = "^2.2"
torch-geometric = "^2.5"

# Causal Inference
# causal-learn = "^0.1"  # For PC algorithm

# Agentic Workflow
langgraph = "^0.1"

# Config & Validation
pydantic = "^2.6"

# Utilities
tqdm = "^4.66"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^24.1"
ruff = "^0.2"
mypy = "^1.8"
ipykernel = "^6.29"

[tool.poetry.scripts]
cointegration-gnn = "cointegration_gnn.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cointegration_gnn --cov-report=term-missing"
